name = "presentacion-mr-robot-api"
main = "src/index.js"
compatibility_date = "2026-08-27"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

[vars]
ENTORNO = "desarrollo"
CORS_ORIGEN_PERMITIDO = "http://localhost:5173"
LIMITE_CUERPO_BYTES = "1048576"
RATE_LIMIT_MAXIMO = "120"
RATE_LIMIT_VENTANA_MS = "60000"
# Piper TTS se genera en GitHub Actions y no requiere secreto TTS en Cloudflare.
# FAL_KEY solo es opcional si se reactiva un proveedor TTS pago.
# No guardar tokens reales en este archivo.

[env.production]
name = "presentacion-mr-robot-api"

[env.production.vars]
ENTORNO = "produccion"
CORS_ORIGEN_PERMITIDO = "https://presentacionvideo.ianvera395.workers.dev"
LIMITE_CUERPO_BYTES = "1048576"
RATE_LIMIT_MAXIMO = "120"
RATE_LIMIT_VENTANA_MS = "60000"
# Configurar secretos reales con:
# wrangler secret put SUPABASE_URL --env production
# wrangler secret put SUPABASE_ANON_KEY --env production
# wrangler secret put SUPABASE_SERVICE_ROLE_KEY --env production
# Variable opcional no secreta: SUPABASE_BUCKET_AUDIO = "audios"
# wrangler secret put CLOUDINARY_CLOUD_NAME --env production
# wrangler secret put CLOUDINARY_API_KEY --env production
# wrangler secret put CLOUDINARY_API_SECRET --env production
# Piper TTS no requiere FAL_KEY ni HF_TOKEN en Cloudflare.
# FAL_KEY es opcional si se reactiva un proveedor TTS pago.
# wrangler secret put GITHUB_TOKEN --env production
# wrangler secret put GITHUB_REPOSITORIO --env production
# Variables opcionales:
# GITHUB_WORKFLOW_RENDER = "renderizar-video.yml"
# GITHUB_RAMA_RENDER = "main"
