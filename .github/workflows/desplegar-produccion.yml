name: Desplegar produccion

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  verificar:
    name: Verificar calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar estructura
        run: npm run verificar

      - name: Auditar produccion
        run: npm run auditar

      - name: Ejecutar pruebas
        run: npm run probar

      - name: Construir panel
        run: npm run panel:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  desplegar_api:
    name: Desplegar API Worker
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Desplegar Worker
        run: npx wrangler deploy --config aplicaciones/api/wrangler.toml --env production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  desplegar_panel:
    name: Desplegar panel Pages
    runs-on: ubuntu-latest
    needs: desplegar_api
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Construir panel
        run: npm run panel:build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Desplegar Cloudflare Pages
        run: npx wrangler pages deploy dist/panel --project-name presentacion-mr-robot-panel --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  desplegar_pagina_publica:
    name: Desplegar pagina publica
    runs-on: ubuntu-latest
    needs: verificar
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Exportar pagina publica
        run: npm run pagina:exportar -- --subdominio "${{ secrets.SUBDOMINIO_PAGINA }}"

      - name: Desplegar pagina publica Cloudflare Pages
        run: npm run pagina:deploy:produccion
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
