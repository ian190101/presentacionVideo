name: Validar produccion

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verificar:
    name: Verificar calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar estructura
        run: npm run verificar

      - name: Auditar produccion
        run: npm run auditar

      - name: Ejecutar pruebas
        run: npm run probar

      - name: Construir panel sin secretos
        run: npm run panel:build
        env:
          VITE_API_URL: https://presentacion-mr-robot-api.workers.dev
          VITE_SUPABASE_URL: https://placeholder.supabase.co
          VITE_SUPABASE_ANON_KEY: placeholder_anon_public

      - name: Exportar pagina publica sin secretos
        run: npm run pagina:exportar
